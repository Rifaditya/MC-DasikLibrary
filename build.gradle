plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.2'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0-beta.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // mappings loom.officialMojangMappings()

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    mixin {
        defaultRefmapName = "dasik-library-refmap.json"
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = "Build ${project.mod_version}: Protocol 2.1 Alignment & Infrastructure Update"
    type = STABLE
    modLoaders.add("fabric")

    modrinth {
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires {
            slug = "fabric-api"
        }
    }

    curseforge {
        projectId = project.curseforge_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires {
            slug = "fabric-api"
        }
    }

    github {
        repository = project.github_repo
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = providers.environmentVariable("GITHUB_SHA").orElse("master")
        tagName = project.mod_version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive directory and Modrinth profile'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    // 1. Central Archive
                    def archiveDir = file("Archive")
                    if (archiveDir.exists()) {
                        copy {
                            from jarFile
                            into archiveDir
                        }
                        println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"
                    }
                    
                    // 2. Modrinth Profile Sync (if directory exists)
                    def modrinthProfileMods = file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3-snapshot-4/mods")
                    if (modrinthProfileMods.exists()) {
                        modrinthProfileMods.listFiles().each { f ->
                            if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                f.delete()
                                println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                            }
                        }
                        copy {
                            from jarFile
                            into modrinthProfileMods
                        }
                        println "[MODRINTH-SYNC] Deployed ${jarFile.name} to Modrinth profile mods folder."
                    }
                }
            }
        }

        tasks.named('build').configure {
            finalizedBy archiveTask
        }
    }
}
